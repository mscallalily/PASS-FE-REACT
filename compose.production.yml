name: pass-uat-fe

services:
  pass-fe:
    container_name: pass-fe
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:8091:80"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1/ || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s